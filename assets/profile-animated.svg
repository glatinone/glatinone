<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
  <title id="title">Kiell Tampubolon | Applied AI and Cybersecurity</title>
  <desc id="desc">Animated concept trace of an agent request, policy boundary, and audit receipt. Illustration, not live telemetry.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .flow { stroke-dasharray: 7 15; animation: travel 2s linear infinite; }
    .cursor { animation: blink 1.2s steps(2,end) infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .line1 { animation: first 12s infinite; }
    .line2 { animation: second 12s infinite; }
    .line3 { animation: third 12s infinite; }
    @keyframes travel { to { stroke-dashoffset: -88; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { stroke: #76efc4; fill: #193b32; } }
    @keyframes first { 0%,8% { opacity: 0; } 12%,92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes second { 0%,30% { opacity: 0; } 34%,92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes third { 0%,52% { opacity: 0; } 56%,92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow,.cursor,.pulse,.line1,.line2,.line3 { animation: none; } }
  </style>
  <rect width="1100" height="490" rx="8" fill="#101213"/>
  <path d="M0 1H1100" stroke="#76efc4" stroke-width="3"/>
  <path d="M38 47H54M46 39V55" stroke="#76efc4" stroke-width="2"/>
  <text x="68" y="53" class="mono" font-size="15" fill="#76efc4">GLATINONE</text>
  <text x="1060" y="53" text-anchor="end" class="mono" font-size="13" fill="#8b969b">AI / SECURITY / SYSTEMS</text>
  <text x="37" y="135" font-size="65" font-weight="700" fill="#f5f7f8">Kiell Tampubolon<tspan fill="#76efc4">.</tspan></text>
  <text x="40" y="176" font-size="23" fill="#b9c2c7">Applied AI &amp; Cybersecurity Engineer</text>
  <text x="40" y="214" font-size="17" fill="#8b969b">Building agents with memory, boundaries, and evidence.</text>
  <path d="M40 247H1060" stroke="#303639"/>
  <g class="mono" font-size="12" fill="#8b969b">
    <text x="40" y="277">01 / THE REQUEST</text>
    <text x="419" y="277">02 / THE BOUNDARY</text>
    <text x="810" y="277">03 / THE EVIDENCE</text>
  </g>
  <g fill="#191e21" stroke="#3b474c">
    <rect x="40" y="294" width="250" height="56" rx="5"/>
    <rect x="420" y="294" width="250" height="56" rx="5" class="pulse"/>
    <rect x="810" y="294" width="250" height="56" rx="5"/>
  </g>
  <g class="mono" font-size="19">
    <text x="61" y="329" fill="#f3f5f7">&gt; agent.tool_call</text>
    <text x="445" y="329" fill="#76efc4">[ policy.check ]</text>
    <text x="838" y="329" fill="#eeb987">+ audit.receipt</text>
  </g>
  <g fill="none" stroke="#76efc4" stroke-width="2" class="flow">
    <path d="M292 322H415"/>
    <path d="M672 322H805"/>
  </g>
  <g class="mono" font-size="15">
    <text x="40" y="389" fill="#b9c2c7" class="line1"><tspan fill="#76efc4">$</tspan> inspect request.scope</text>
    <text x="40" y="417" fill="#b9c2c7" class="line2"><tspan fill="#76efc4">&gt;</tspan> enforce explicit boundaries</text>
    <text x="40" y="445" fill="#b9c2c7" class="line3"><tspan fill="#eeb987">+</tspan> keep a trace you can verify</text>
    <rect x="379" y="432" width="8" height="16" fill="#76efc4" class="cursor"/>
  </g>
  <text x="1060" y="448" text-anchor="end" class="mono" font-size="12" fill="#718086">CONCEPT TRACE / LOOP 12s</text>
</svg>
